name: Build installer

on:
  push:
    tags: ['v*']          # git tag v1.0.0 && git push --tags  →  GitHub Release with Setup.exe
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.$env:GITHUB_RUN_NUMBER" }
          ./build.ps1 -Version $version

      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-Setup
          path: |
            dist/*.exe
            dist/*.sha256

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/*.sha256
